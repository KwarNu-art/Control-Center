name: Build Control-Center Tweak  
  
on:  
  push:  
    branches: [ main, master ]  
  pull_request:  
    branches: [ main, master ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: macos-13  
  
    steps:  
      - name: Checkout Source Code  
        uses: actions/checkout@v4  
  
      - name: Install Theos Dependencies  
        run: |  
          brew install ldid xz make  
          echo "THEOS=~/theos" >> $GITHUB_ENV  
  
      - name: Setup Theos Toolchain & SDK  
        run: |  
          git clone --recursive https://github.com/theos/theos.git ~/theos  
          git clone --depth 1 https://github.com/theos/sdks.git ~/theos/sdks  
          curl -LO https://github.com/theos/sdks/releases/latest/download/iPhoneOS14.5.sdk.tar.xz  
          tar -xf iPhoneOS14.5.sdk.tar.xz -C ~/theos/sdks/  
          rm iPhoneOS14.5.sdk.tar.xz  
  
      - name: Compile Rootless .deb Package (Dopamine / Palera1n)  
        run: |  
          export THEOS_PACKAGE_SCHEME=rootless  
          make clean  
          make package FINALPACKAGE=1  
  
      - name: Compile Rootful .deb Package (Checkra1n / Unc0ver)  
        run: |  
          export THEOS_PACKAGE_SCHEME=rootful  
          make clean  
          make package FINALPACKAGE=1  
  
      - name: Upload Debian Packages to Artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: Control-Center-iOS26-Packages  
          path: packages/*.deb
